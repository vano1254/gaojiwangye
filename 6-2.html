<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-2 标题栏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .title {
            width: 500px;
            height: 33px;
            line-height: 33px;
            margin: 50px;
        }
        .title h2 {
            font-size: 14px;
            padding-left: 10px;
        }
        .title a {
            font-size: 12px;
            color: #ccc;
            text-decoration: none;
            margin-right: 6px;
        }

        .title:nth-child(1) {
            border: 1px solid #ccc;   
        }
        .title:nth-child(1) h2 {
            float: left;           
        }
        .title:nth-child(1) a {
            float: right;           
        }

        .title:nth-child(2) {
            display: flex;
            border-top: 1px solid #ccc;
        }
        .title:nth-child(2) h2 {
            flex-grow: 1;
        }

        .title:nth-child(3) {
            position: relative;
            border-bottom: 1px solid #ccc;
        }
        .title:nth-child(3) a {    
            position: absolute;
            right: 6px;
            top: 0;
        }
    </style>
</head>
<body>
    <div class="title">
        <h2>王梓杨的标题</h2><a href="#">更多</a>
    </div>
    <div class="title">
        <h2>王梓杨的标题</h2><a href="#">更多</a>
    </div>
    <div class="title">
        <h2>王梓杨的标题</h2><a href="#">更多</a>
    </div>
</body>
</html>
