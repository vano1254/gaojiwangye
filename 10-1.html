<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-1 animation 动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            background: #fff;
            padding: 20px;
        }

        /* ===== 页面大标题：王梓杨的animation动画 ===== */
        h1 {
            font-size: 30px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 1px;
            margin: 0 0 10px 10px;
        }
        .tip {
            font-size: 14px;
            color: #666;
            line-height: 1.9;
            margin: 0 0 24px 12px;
        }
        .tip code {
            font-family: Consolas, "Courier New", monospace;
            background: #f2f2f2;
            padding: 1px 6px;
        }

        /* ===== 关键帧：盒子的背景颜色随时间在四种颜色之间来回变化 ===== */
        /* 0% / 25% / 50% / 75% 分别是四种颜色，100% 写回开头的红色，
           首尾同色，循环一圈结束时才不会“咔”地跳一下。 */
        @keyframes colorChange {
            0%   { background-color: #e74c3c; }   /* ① 红 */
            25%  { background-color: #f39c12; }   /* ② 橙 */
            50%  { background-color: #27ae60; }   /* ③ 绿 */
            75%  { background-color: #2980b9; }   /* ④ 蓝 */
            100% { background-color: #e74c3c; }   /* 回到红，无缝循环 */
        }

        /* ===== 主盒子：背景颜色随时间变化（本节重点）===== */
        .stage {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 44px 20px;
            background: #fafafa;
            border: 1px solid #e8e8e8;
        }
        .box {
            width: 300px;
            height: 300px;
            background-color: #e74c3c;            /* 静态兜底色 */
            box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
            /* 纯 CSS 动画：动画名 时长 速度曲线 循环次数 */
            animation: colorChange 8s linear infinite;
        }
        .box:hover {
            animation-play-state: paused;         /* 鼠标放上去暂停，方便看现在是第几色 */
        }

        /* ===== 三组对照：同一个关键帧，换 animation 的不同属性 ===== */
        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 34px;
        }
        .mini {
            width: 220px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #e74c3c;            /* 静态兜底色 */
            box-shadow: 0 4px 12px rgba(0, 0, 0, .16);
        }
        .mini span {
            font-size: 13px;
            color: #fff;
            padding: 5px 11px;
            background: rgba(0, 0, 0, .38);
        }
        .mini:hover {
            animation-play-state: paused;
        }
        /* ① 延迟 1 秒才开始 */
        .mini1 { animation: colorChange 8s linear 1s infinite; }
        /* ② alternate 往复：正着走一遍，再倒着走一遍 */
        .mini2 { animation: colorChange 8s ease-in-out infinite alternate; }
        /* ③ steps 硬切换：不做渐变，到点直接换成下一种颜色 */
        .mini3 { animation: colorChange 8s steps(1, end) infinite; }

        /* 无障碍：系统开启“减少动态效果”时停在兜底色，不闪烁 */
        @media (prefers-reduced-motion: reduce) {
            .box,
            .mini {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <h1>王梓杨的animation动画</h1>
    <p class="tip">
        一个盒子，背景颜色随时间自动变化 —— 关键帧 <code>@keyframes</code> +
        <code>animation</code>，纯 CSS，四种颜色循环。<br>
        鼠标移到任意盒子上可以暂停动画。
    </p>

    <!-- 主演示：背景颜色随时间变化 -->
    <div class="stage">
        <div class="box"></div>
    </div>

    <!-- 三组对照：同一个关键帧，换 animation 的不同属性 -->
    <div class="row">
        <div class="mini mini1"><span>delay 延迟 1s</span></div>
        <div class="mini mini2"><span>alternate 往复</span></div>
        <div class="mini mini3"><span>steps 硬切换</span></div>
    </div>
</body>
</html>
