<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cengdie</title>
    <style>
        /* 标签选择器：所有h2统一黑底白字 */
        h2 {
            background-color: black;
            color: white;
        }

        p {
            color: #96a;
            font-size: 50px;
        }

        /* id选择器 */
        #box {
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }

        /* 类选择器 */
        .n1 { color: blue; }
        .n2 { color: red; }
        .n3 { color: green; }

        /* 拓展3：白色文字类 */
        .text-white {
            color: white;
        }

        /* 拓展3：300×300盒子 */
        .box-small {
            width: 300px;
            height: 300px;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <!-- 这个h2会自动应用黑底白字 -->
    <h2>层叠样式表 CSS</h2>
    
    <div id="box">
        <p>CSS<span class="text-white">选择器</span></p>
        <p><span class="n1">王</span><span class="n2">梓</span><span class="n3">杨</span></p>
        <p>CSS属性</p>
    </div>

    <div class="box-small"></div>
</body>
</html>
