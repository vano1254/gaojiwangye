<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-2 盒模型</title>
    <style>
        #a{
            width:400px;
            height:400px;
            border:1px solid #039;
            padding:50px 40px 30px 20px; /*上 右 下 左*/
            margin:40px auto;
        }
        #b{
            width:400px;
            height:400px;
            border:1px dashed #039;
            margin:50px auto 40px;
        }
        #c{
            width:400px;
            height:400px;
            border:1px dotted #039;
            padding:30px;
            margin:0 auto;
        }
    </style>
</head>
<body>
    <div id="a">411wzy</div>
    <div id="b">411wzy</div>
    <div id="c">411wzy</div>
</body>
</html>
