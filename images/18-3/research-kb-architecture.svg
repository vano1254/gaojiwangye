<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 870" role="img" aria-labelledby="wzy_svg_title wzy_svg_desc" id="wzy_architecture">
<title id="wzy_svg_title">科研知识库智能客服系统架构图</title><desc id="wzy_svg_desc">离线：文献来源、解析、清洗、分块、向量化及知识存储。在线：提问、权限、混合检索、重排、生成、引用回答或转人工。评估反馈经人工审核更新知识库，监控与审计贯穿全流程。</desc>
<defs><marker id="wzy_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#718f81" stroke-width="1.5"/></marker><style>.wzy_node{cursor:pointer;outline:none}.wzy_node:hover rect,.wzy_node:focus rect,.wzy_node[aria-pressed="true"] rect{stroke:#276f58;stroke-width:2.5}.wzy_lane{transition:opacity .2s}.wzy_node text{pointer-events:none}text{font-family:"Microsoft YaHei",Arial,sans-serif}</style></defs>
<rect width="1280" height="870" fill="#fbfcf8"/><text x="50" y="38" font-size="13" fill="#526b60" letter-spacing="2">RESEARCH KNOWLEDGE / RAG ARCHITECTURE</text><text x="1230" y="38" text-anchor="end" font-size="12" fill="#85958a">王梓杨 · 18-3 · 教学架构</text>
<rect x="24" y="66" width="1232" height="360" fill="#edf3eb" stroke="#d9e3d6"/><text x="50" y="105" font-size="20" font-weight="700" fill="#304e3e">01　离线知识入库</text><text x="50" y="294" font-size="13" fill="#71826e">以审核后的科研文献为依据，保留出处与权限。</text><text x="50" y="319" font-size="12" fill="#71826e">分块后同步保存原文与元数据；向量通过文档 ID 关联证据。</text>
<rect x="24" y="452" width="1232" height="336" fill="#eff3f5" stroke="#dce4e7"/><text x="50" y="487" font-size="20" font-weight="700" fill="#355666">02　在线检索增强问答</text>
<g fill="none" stroke="#8fa899" stroke-width="1.5" marker-end="url(#wzy_arrow)"><path d="M250 194H290" class="wzy_lane" data-lane="ingest"/><path d="M490 194H530" class="wzy_lane" data-lane="ingest"/><path d="M730 194H770" class="wzy_lane" data-lane="ingest"/><path d="M970 194H1010" class="wzy_lane" data-lane="ingest"/><path d="M1110 232V326" class="wzy_lane" data-lane="ingest"/><path d="M870 232V326" class="wzy_lane" data-lane="ingest"/><path d="M250 544H290" class="wzy_lane" data-lane="query"/><path d="M490 544H530" class="wzy_lane" data-lane="query"/><path d="M730 544H770" class="wzy_lane" data-lane="query"/><path d="M970 544H1010" class="wzy_lane" data-lane="query"/><path d="M1110 402V446H630V506" class="wzy_lane" data-lane="query"/><path d="M870 402V472H656V506" class="wzy_lane" data-lane="query"/><path d="M1110 582V676" class="wzy_lane" data-lane="query"/><path d="M870 582V676" class="wzy_lane" data-lane="query"/><path d="M1010 714H970" class="wzy_lane" data-lane="feedback" stroke-dasharray="5 5"/><path d="M1110 752V808H150V752" class="wzy_lane" data-lane="feedback" stroke-dasharray="5 5"/><path d="M50 714H32V112H150V156" class="wzy_lane" data-lane="feedback" stroke-dasharray="5 5"/></g>
<rect x="688" y="430" width="265" height="24" fill="#fbfcf8"/><text x="701" y="447" font-size="11" fill="#6b8274">检索时按 ACL 过滤，携带原文及出处</text>
<g class="wzy_node" id="wzy_sources" data-node="sources" tabindex="0" role="button" aria-pressed="false" aria-label="科研知识来源：论文 · 项目文档 · 实验 FAQ"><title>汇集已获授权的论文、课题文档、实验室制度与科研服务常见问题，记录来源、版本和访问权限。</title><rect x="50" y="156" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="50" y="156" width="3" height="76" fill="#698663" stroke="none"/><text x="64" y="186" font-size="17" fill="#2f4b3b" font-weight="700">科研知识来源</text><text x="64" y="210" font-size="11" fill="#718575">论文 · 项目文档 · 实验 FAQ</text></g>
<g class="wzy_node" id="wzy_parse" data-node="parse" tabindex="0" role="button" aria-pressed="false" aria-label="文档解析：PDF / Word · OCR · 表格"><title>提取文本、表格与章节结构；扫描件需要 OCR，公式和图表提取结果需要人工抽查。</title><rect x="290" y="156" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="290" y="156" width="3" height="76" fill="#698663" stroke="none"/><text x="304" y="186" font-size="17" fill="#2f4b3b" font-weight="700">文档解析</text><text x="304" y="210" font-size="11" fill="#718575">PDF / Word · OCR · 表格</text></g>
<g class="wzy_node" id="wzy_clean" data-node="clean" tabindex="0" role="button" aria-pressed="false" aria-label="清洗与审核：去重 · 质量检查 · 版本管理"><title>剔除重复和无关内容，核对版本与授权范围。审核通过的材料进入知识库，避免把未确认结论作为正式知识。</title><rect x="530" y="156" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="530" y="156" width="3" height="76" fill="#698663" stroke="none"/><text x="544" y="186" font-size="17" fill="#2f4b3b" font-weight="700">清洗与审核</text><text x="544" y="210" font-size="11" fill="#718575">去重 · 质量检查 · 版本管理</text></g>
<g class="wzy_node" id="wzy_chunk" data-node="chunk" tabindex="0" role="button" aria-pressed="false" aria-label="语义分块：章节切分 · 页码 · 文档 ID"><title>按章节与语义边界切分片段，保留文档 ID、页码、课题组和权限元数据，用于定位原文与访问控制。</title><rect x="770" y="156" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="770" y="156" width="3" height="76" fill="#698663" stroke="none"/><text x="784" y="186" font-size="17" fill="#2f4b3b" font-weight="700">语义分块</text><text x="784" y="210" font-size="11" fill="#718575">章节切分 · 页码 · 文档 ID</text></g>
<g class="wzy_node" id="wzy_embed" data-node="embed" tabindex="0" role="button" aria-pressed="false" aria-label="向量化 Embedding：文本片段 → 语义向量"><title>把每段知识转换为可检索的向量；查询也使用兼容的嵌入模型。更新模型时需重新建立对应索引。</title><rect x="1010" y="156" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="1010" y="156" width="3" height="76" fill="#698663" stroke="none"/><text x="1024" y="186" font-size="17" fill="#2f4b3b" font-weight="700">向量化 Embedding</text><text x="1024" y="210" font-size="11" fill="#718575">文本片段 → 语义向量</text></g>
<g class="wzy_node" id="wzy_metadata" data-node="metadata" tabindex="0" role="button" aria-pressed="false" aria-label="原文与元数据：原文 · 页码 · ACL · 版本"><title>保存可引用的原文、章节、页码、权限与版本信息，并为关键词检索提供索引。检索必须同时执行权限过滤。</title><rect x="770" y="326" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="770" y="326" width="3" height="76" fill="#698663" stroke="none"/><text x="784" y="356" font-size="17" fill="#2f4b3b" font-weight="700">原文与元数据</text><text x="784" y="380" font-size="11" fill="#718575">原文 · 页码 · ACL · 版本</text></g>
<g class="wzy_node" id="wzy_vectors" data-node="vectors" tabindex="0" role="button" aria-pressed="false" aria-label="向量索引：片段向量 · 文档 ID · ACL"><title>保存向量及其文档关联，以语义相似度召回候选片段；以课题组、用户和文档权限限制可见范围。</title><rect x="1010" y="326" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="1010" y="326" width="3" height="76" fill="#698663" stroke="none"/><text x="1024" y="356" font-size="17" fill="#2f4b3b" font-weight="700">向量索引</text><text x="1024" y="380" font-size="11" fill="#718575">片段向量 · 文档 ID · ACL</text></g>
<g class="wzy_node" id="wzy_question" data-node="question" tabindex="0" role="button" aria-pressed="false" aria-label="科研人员提问：文献定位 · 方法咨询 · 办事"><title>通过网页提交科研咨询，例如查找某方法的实验步骤、某项目文档所在章节，或查询科研办事流程。</title><rect x="50" y="506" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="50" y="506" width="3" height="76" fill="#668c9b" stroke="none"/><text x="64" y="536" font-size="17" fill="#2f4b3b" font-weight="700">科研人员提问</text><text x="64" y="560" font-size="11" fill="#718575">文献定位 · 方法咨询 · 办事</text></g>
<g class="wzy_node" id="wzy_auth" data-node="auth" tabindex="0" role="button" aria-pressed="false" aria-label="身份与查询处理：身份校验 · 权限 · 查询改写"><title>验证身份并识别课题组权限，检查问题范围，必要时澄清或改写查询，再将用户权限随请求传入检索阶段。</title><rect x="290" y="506" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="290" y="506" width="3" height="76" fill="#668c9b" stroke="none"/><text x="304" y="536" font-size="17" fill="#2f4b3b" font-weight="700">身份与查询处理</text><text x="304" y="560" font-size="11" fill="#718575">身份校验 · 权限 · 查询改写</text></g>
<g class="wzy_node" id="wzy_retrieve" data-node="retrieve" tabindex="0" role="button" aria-pressed="false" aria-label="混合检索：查询向量化 · 语义 + 关键词"><title>结合向量召回与关键词检索，提高专业术语和语义问题的覆盖率。检索阶段过滤无权限文档，不能依赖生成后隐藏。</title><rect x="530" y="506" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="530" y="506" width="3" height="76" fill="#668c9b" stroke="none"/><text x="544" y="536" font-size="17" fill="#2f4b3b" font-weight="700">混合检索</text><text x="544" y="560" font-size="11" fill="#718575">查询向量化 · 语义 + 关键词</text></g>
<g class="wzy_node" id="wzy_rerank" data-node="rerank" tabindex="0" role="button" aria-pressed="false" aria-label="重排与证据筛选：相关性排序 · 去重 · 阈值"><title>对候选片段重排，选择支持回答的证据。证据不足或问题超出知识库范围时，应澄清、拒绝推断或转人工。</title><rect x="770" y="506" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="770" y="506" width="3" height="76" fill="#668c9b" stroke="none"/><text x="784" y="536" font-size="17" fill="#2f4b3b" font-weight="700">重排与证据筛选</text><text x="784" y="560" font-size="11" fill="#718575">相关性排序 · 去重 · 阈值</text></g>
<g class="wzy_node" id="wzy_generate" data-node="generate" tabindex="0" role="button" aria-pressed="false" aria-label="大模型生成：问题 + 可访问证据 → 回答"><title>根据问题和检索证据生成答复，要求附带引用；知识库文本视为数据，不作为系统指令执行。科研结论需核对原文。</title><rect x="1010" y="506" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="1010" y="506" width="3" height="76" fill="#668c9b" stroke="none"/><text x="1024" y="536" font-size="17" fill="#2f4b3b" font-weight="700">大模型生成</text><text x="1024" y="560" font-size="11" fill="#718575">问题 + 可访问证据 → 回答</text></g>
<g class="wzy_node" id="wzy_answer" data-node="answer" tabindex="0" role="button" aria-pressed="false" aria-label="引用溯源回答：文档名 · 页码 · 证据片段"><title>返回回答及关联文档、页码和片段，便于科研人员核对。证据与回答需一致，引用不能保证结论本身正确。</title><rect x="1010" y="676" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="1010" y="676" width="3" height="76" fill="#668c9b" stroke="none"/><text x="1024" y="706" font-size="17" fill="#2f4b3b" font-weight="700">引用溯源回答</text><text x="1024" y="730" font-size="11" fill="#718575">文档名 · 页码 · 证据片段</text></g>
<g class="wzy_node" id="wzy_human" data-node="human" tabindex="0" role="button" aria-pressed="false" aria-label="澄清或人工转接：无证据 · 低相关 · 专业复核"><title>证据不足、权限不满足或需专业判断时，提示原因并转交科研服务人员；补充知识需经审核，不能直接自动入库。</title><rect x="770" y="676" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="770" y="676" width="3" height="76" fill="#668c9b" stroke="none"/><text x="784" y="706" font-size="17" fill="#2f4b3b" font-weight="700">澄清或人工转接</text><text x="784" y="730" font-size="11" fill="#718575">无证据 · 低相关 · 专业复核</text></g>
<g class="wzy_node" id="wzy_evaluate" data-node="evaluate" tabindex="0" role="button" aria-pressed="false" aria-label="评估与反馈：召回率 · 引用正确率 · 满意度"><title>以有标注的科研问题集评估检索、引用与回答质量，汇总脱敏反馈供人工审核后更新知识库。</title><rect x="50" y="676" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="50" y="676" width="3" height="76" fill="#668c9b" stroke="none"/><text x="64" y="706" font-size="17" fill="#2f4b3b" font-weight="700">评估与反馈</text><text x="64" y="730" font-size="11" fill="#718575">召回率 · 引用正确率 · 满意度</text></g>
<g class="wzy_node" id="wzy_ops" data-node="ops" tabindex="0" role="button" aria-pressed="false" aria-label="运行保障：访问审计 · 脱敏 · 监控"><title>为全链路提供日志、监控、访问审计和敏感信息脱敏，记录模型与知识版本，便于排错与结果追踪。</title><rect x="290" y="676" width="200" height="76" fill="#fff" stroke="#c7d6cb"/><rect x="290" y="676" width="3" height="76" fill="#668c9b" stroke="none"/><text x="304" y="706" font-size="17" fill="#2f4b3b" font-weight="700">运行保障</text><text x="304" y="730" font-size="11" fill="#718575">访问审计 · 脱敏 · 监控</text></g>
<text x="50" y="843" font-size="12" fill="#819084">实线：知识 / 查询流　　虚线：反馈与兜底　　ACL：访问控制　　RAG：检索增强生成　　运行保障覆盖全链路</text></svg>